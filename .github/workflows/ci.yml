name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NX_NON_NATIVE_HASHER: true
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  format:
    runs-on: ubuntu-latest
    name: Format check
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set base and head for Nx affected commands
        uses: nrwl/nx-set-shas@v5
      - name: Install dependencies
        uses: ./.github/actions/install
      - name: Check formatting of affected files
        run: npx nx format:check

  lint:
    runs-on: ubuntu-latest
    name: Linter
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set base and head for Nx affected commands
        uses: nrwl/nx-set-shas@v5
      - name: Install dependencies
        uses: ./.github/actions/install
      - name: Lint affected projects
        run: npx nx affected -t lint --parallel=3

  unit-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    name: Unit tests
    runs-on: ${{ matrix.os }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set base and head for Nx affected commands
        uses: nrwl/nx-set-shas@v5
      - name: Install dependencies
        uses: ./.github/actions/install
      - name: Unit test affected projects
        run: npx nx affected -t unit-test --parallel=3

  integration-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    name: Integration tests
    runs-on: ${{ matrix.os }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set base and head for Nx affected commands
        uses: nrwl/nx-set-shas@v5
      - name: Install dependencies
        uses: ./.github/actions/install
      - name: Integration test affected projects
        run: npx nx affected -t int-test --parallel=3

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    name: E2E tests
    runs-on: ${{ matrix.os }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set base and head for Nx affected commands
        uses: nrwl/nx-set-shas@v5
      - name: Install dependencies
        uses: ./.github/actions/install
      - name: E2E test affected projects
        run: npx nx affected -t e2e-test --parallel=1

  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set base and head for Nx affected commands
        uses: nrwl/nx-set-shas@v5
      - name: Install dependencies
        uses: ./.github/actions/install
      - name: Build all projects # affected is not used to be able to test-releae packages
        run: npx nx run-many --target=build --parallel=3
      - name: Test-release packages
        run: npx pkg-pr-new publish "packages/**/dist"
